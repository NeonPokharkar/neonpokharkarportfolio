name: Build and publish Angular site

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/

      - name: Prepare SPA fallback
        run: |
          cp ./dist/neon-portfolio/browser/index.html ./dist/neon-portfolio/browser/404.html
          cp ./CNAME ./dist/neon-portfolio/browser/CNAME

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/neon-portfolio/browser
          publish_branch: gh-pages
          force_orphan: true
          cname: neonpokharkar.com