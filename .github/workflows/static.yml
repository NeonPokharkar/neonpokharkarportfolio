name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"] # Change to your default branch name if different

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/neonpokharkarportfolio/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Replace 'YOUR_PROJECT_NAME' with the actual project name from your angular.json file
          # For Angular 17+, the build path usually ends with '/browser'
          path: ./dist/neon-portfolio/browser 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
