<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Aditya Pokharkar — Full Stack &amp; Systems Engineer</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        let preference = null;
        try {
          preference = window.localStorage.getItem('aditya-portfolio-theme');
        } catch (error) {
          console.warn('Theme preference could not be loaded.', error);
        }

        if (preference === 'day' || preference === 'night') {
          document.documentElement.dataset.theme = preference;
          return;
        }

        const prefersNight = typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const hour = new Date().getHours();
        document.documentElement.dataset.theme = prefersNight || hour < 6 || hour >= 18 ? 'night' : 'day';
      })();
    </script>
    <style>
      html[data-theme='night'], html[data-theme='night'] body {
        background: #11110f;
        color: #f2efe9;
        color-scheme: dark;
      }
    </style>
    <meta name="description" content="Aditya Pokharkar is a Full Stack &amp; Systems Engineer building resilient enterprise platforms, local-first AI workflows, and user-first products.">
    <link rel="ard" href="/.well-known/ard.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
