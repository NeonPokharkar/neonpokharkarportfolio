name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/neonpokharkarportfolio/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # This points to the compiled production files. 
          # Note: If your build fails here, you may need to check if your project folder name 
          # inside dist/ is different, or remove '/browser' if using an older Angular version.
          path: ./dist/neonpokharkarportfolio/browser 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4